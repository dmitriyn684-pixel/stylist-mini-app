<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07090d" />
    <meta
      name="description"
      content="DimkoFF — AI-продукты, Telegram Mini Apps, SMM-системы и premium digital experiences для бизнеса."
    />
    <title>DimkoFF — AI-продукты и Telegram Mini Apps</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages — разворачивает редирект из 404.html
      // обратно в нормальный путь ДО того, как React Router его прочитает.
      // https://github.com/rafgraph/spa-github-pages
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
